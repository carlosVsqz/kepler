main.datasource.url=${DB_URL}
main.datasource.username=${DB_USERNAME}
main.datasource.password=${DB_PASSWORD}
main.liquibase.change-log=com/escod/kepler/liquibase/changelog.xml
jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/escod/kepler/menu.xml
jmix.ui.composite-menu=true
ui.login.defaultUsername=
ui.login.defaultPassword=
jmix.core.available-locales=es
jmix.ui.component.filter-show-non-jpa-properties=false
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false
# Use pnpm to speed up project initialization and save disk space
vaadin.pnpm.enable=true
logging.level.org.atmosphere=warn
# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info
# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info
# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug
# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info
# oauth 2.1 config
spring.security.oauth2.authorizationserver.client.myapp.registration.client-id=myapp
spring.security.oauth2.authorizationserver.client.myapp.registration.client-secret={noop}myappsecret
spring.security.oauth2.authorizationserver.client.myapp.registration.client-authentication_methods=client_secret_basic,client_secret_post
spring.security.oauth2.authorizationserver.client.myapp.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.myapp.registration.redirect-uris=${REGISTERED_URL:https://oauthdebugger.com/debug}
spring.security.oauth2.authorizationserver.client.myapp.token.access-token-format=reference
spring.security.oauth2.authorizationserver.client.myapp.token.access-token-time-to-live=1h
spring.security.oauth2.authorizationserver.client.myapp.token.refresh-token-time-to-live=24h
spring.security.oauth2.authorizationserver.client.myapp.require-proof-key=true
jmix.authserver.client.myapp.resource-roles=user-management, rest-minimal
# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security.oauth2=trace
#logging.level.org.springframework.security=DEBUG
#jmix.authserver.client.myapp.resource-roles=rest-minimal
jmix.rest.anonymous-url-patterns=\
  /rest/entities/Activity/*, \
  /rest/entities/Post/*,\
  /rest/docs/* ,\
  /rest/participants/create, \
  /rest/participants/findUsername, \
  /rest/queries/**, \
  /rest/logout-app

jmix.core.fetch-plans-config=com/escod/kepler/fetch-plans.xml
jmix.rest.queries-config=com/escod/kepler/rest-queries.xml
# storage config
jmix.core.default-file-storage=${FILE_STORAGE}
# azure config
jmix.azurefs.connectionString=${AZURE_STORAGE_CONNECTION}
jmix.azurefs.containerName=kepler
# max age in hours cached images
app.kepler.max-age.azure.images=${MAX_AGE_IMAGE_CACHE:1}